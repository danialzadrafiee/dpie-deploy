name: release

# Push a tag like v0.1.0 to build standalone binaries and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test

      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux-x64 linux-arm64 windows-x64 darwin-x64 darwin-arm64; do
            ext=""; [ "$t" = "windows-x64" ] && ext=".exe"
            bun build src/index.ts --compile --minify --target=bun-$t --outfile dist/deploy-$t$ext
          done
          ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then TAG="v$(jq -r .version package.json)"; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/* scripts/install.sh scripts/install.ps1 --clobber
